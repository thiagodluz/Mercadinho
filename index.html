<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7ead2">
  <title>Mercadinho</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #51351e; background: #f6e9d1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: radial-gradient(circle at top, #fff9eb, #f1dfbd); }
    button { font: inherit; cursor: pointer; }
    .app { width: min(100%, 520px); min-height: 100dvh; margin: auto; padding: max(14px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
    header { text-align: center; width: 100%; }
    .eyebrow { color: #78854b; font-size: .72rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { display: inline-block; font-size: clamp(2rem, 9vw, 3rem); line-height: 1; margin: 8px 0 10px; padding: 12px 28px; color: #73421f; letter-spacing: -.05em; background: #fff2d4; border: 4px solid #bb783d; border-radius: 20px; box-shadow: inset 0 0 0 3px #f5d39d, 0 4px 0 #8c512a; }
    .level { display: block; width: max-content; margin: auto; background: #fff9ed; border: 1px solid #e7cda4; border-radius: 999px; padding: 6px 17px; font-weight: 800; font-size: .85rem; }
    .instructions { margin: 14px auto 10px; max-width: 310px; font-size: .91rem; line-height: 1.4; color: #775b3c; }
    .board { position: relative; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px; border: 7px solid #a95e29; border-radius: 14px; background: linear-gradient(100deg,#c27b3b,#e6a65f 50%,#c27b3b); box-shadow: inset 0 3px 0 #f4c688, 0 8px 0 #8c4c24, 0 18px 28px #77532930; touch-action: none; user-select: none; }
    .shelf { position: relative; min-width: 0; height: clamp(105px, 29vw, 150px); display: flex; align-items: end; border: 4px solid #8e4d25; border-bottom: 10px solid #d69654; border-radius: 5px; background: linear-gradient(#865033, #a96939 73%, #c18a53 74%); box-shadow: inset 0 6px 12px #5a2f1c50; }
    .back-row, .front-row { position: absolute; inset: 0 3px 2px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; }
    .back-row { transform: translateY(-14%); opacity: .48; filter: brightness(.62); pointer-events: none; }
    .back-row > span { display: flex; justify-content: center; align-items: end; height: 84%; }
    .front-row { z-index: 1; }
    .slot { position: relative; min-width: 0; height: 84%; display: flex; align-items: end; justify-content: center; border: 0; padding: 2px; background: transparent; border-radius: 8px; touch-action: none; }
    .slot:focus-visible { outline: 3px solid #ffdf72; outline-offset: -2px; }
    .slot.empty::after { content: ''; width: 70%; height: 8px; margin-bottom: 2px; background: #633e2866; border-radius: 50%; }
    .slot.selected { background: #ffdf7255; box-shadow: inset 0 0 0 2px #ffdf72; }
    .slot.drop-target { background: #c9ec8055; box-shadow: inset 0 0 0 3px #d8f795, 0 0 12px #e4ffb8; }
    .slot.drag-origin .item { opacity: .25; }
    .dispenser { background: linear-gradient(#76543b, #9b7148 73%, #c18a53 74%); }
    .dispenser .front-row { display: flex; justify-content: center; }
    .dispenser .slot { width: 34%; }
    .dispenser-label { position: absolute; z-index: 2; top: 4px; left: 4px; right: 4px; text-align: center; font-size: clamp(.6rem, 2.2vw, .72rem); font-weight: 800; color: #ffe7ba; pointer-events: none; }
    .dispenser-count { position: absolute; z-index: 2; right: 5px; bottom: 4px; background: #fff1d0; color: #704020; border-radius: 999px; padding: 2px 6px; font-size: .72rem; font-weight: 800; pointer-events: none; }
    .lock-overlay { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; pointer-events: none; background: #38231377; }
    .lock-overlay::before, .lock-overlay::after { content: ''; position: absolute; width: 145%; height: 8px; background: repeating-linear-gradient(90deg, #d5b373 0 7px, #8c7149 7px 10px); border: 1px solid #6c5233; box-shadow: 0 2px 2px #36200e88; transform: rotate(22deg); }
    .lock-overlay::after { transform: rotate(-22deg); }
    .lock-badge { position: relative; z-index: 1; padding: 5px 9px; border: 2px solid #956026; border-radius: 9px; background: #ffd270; color: #5b381b; font-size: .8rem; font-weight: 900; text-align: center; box-shadow: 0 2px 4px #34200e77; }
    .lock-caption { position: absolute; bottom: 3px; z-index: 1; padding: 2px 5px; border-radius: 5px; background: #4a301fe8; color: #fff3d7; font-size: .65rem; font-weight: 800; }
    .item { width: min(100%, 58px); height: 78%; min-height: 62px; max-height: 95px; display: flex; align-items: center; justify-content: center; user-select: none; pointer-events: none; transform-origin: bottom center; }
    .item svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 2px #43291666); }
    .ghost { position: fixed; z-index: 20; pointer-events: none; opacity: .96; filter: drop-shadow(0 7px 5px #39210d55); }
    .ghost .item { width: 100%; height: 100%; min-height: 0; max-height: none; }
    .matching .front-row .item { animation: match-pop .32s ease-in forwards; }
    .revealed .front-row .item { animation: reveal-row .28s ease-out both; }
    @keyframes match-pop { 35% { transform: translateY(-5px) scale(1.12); filter: brightness(1.25); } 100% { transform: translateY(-15px) scale(.15); opacity: 0; } }
    @keyframes reveal-row { from { transform: translateY(-12px) scale(.8); opacity: .35; filter: brightness(.7); } to { transform: none; opacity: 1; filter: none; } }
    .controls { width: 100%; margin-top: 27px; display: flex; gap: 10px; }
    .control { flex: 1; min-height: 50px; border: 0; border-radius: 12px; padding: 10px; font-weight: 800; background: #78984b; color: white; box-shadow: 0 4px #537135; }
    .control.secondary { background: #fff8eb; color: #795634; box-shadow: 0 4px #d6bc94; }
    .control:disabled { opacity: .48; cursor: default; }
    .message { min-height: 2.6em; text-align: center; color: #70563a; font-size: .86rem; margin: 17px 0 0; }
    .win { margin-top: 10px; text-align: center; background: #fff7e4; border: 2px solid #e0bd77; padding: 16px; border-radius: 14px; width: 100%; }
    .win h2 { margin: 0 0 4px; font-size: 1.3rem; }
    .win p { margin: 0; }
    .win .control { margin-top: 12px; padding-inline: 22px; }
    .level-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 9px; }
    .level-choice { border: 1px solid #dfc59e; background: #fff8eb; color: #705238; border-radius: 999px; padding: 5px 12px; font-size: .76rem; font-weight: 800; }
    .level-choice[aria-current="step"] { background: #79984b; color: white; border-color: #79984b; }
    .level-choice:disabled { opacity: .5; cursor: default; }
    .settings { width: 100%; margin-top: 14px; border: 1px solid #e2cba8; border-radius: 12px; background: #fff8eb; color: #705238; }
    .settings summary { padding: 11px 14px; cursor: pointer; font-weight: 800; }
    .settings-content { display: grid; gap: 12px; padding: 0 14px 15px; }
    .setting-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 14px; font-size: .9rem; }
    .setting-row label { font-weight: 700; }
    .setting-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: #78984b; }
    .setting-row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #78984b; }
    .setting-note { margin: 0; font-size: .77rem; line-height: 1.35; color: #806b51; }
    [hidden] { display: none !important; }
    @media (max-height: 650px) { h1 { padding: 6px 20px; margin: 4px 0 6px; } .instructions { margin: 8px auto; } .shelf { height: min(25vw, 110px); } .controls { margin-top: 18px; } }
    @media (prefers-reduced-motion: reduce) { .matching .front-row .item, .revealed .front-row .item { animation-duration: .01ms; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">Um jogo de organizar</div>
      <h1>Mercadinho</h1>
      <div id="level" class="level">Fase 1</div>
      <nav class="level-nav" aria-label="Escolher fase">
        <button id="level-one" class="level-choice" type="button" aria-current="step">Fase 1</button>
        <button id="level-two" class="level-choice" type="button" disabled>Fase 2 🔒</button>
        <button id="level-three" class="level-choice" type="button" disabled>Fase 3 🔒</button>
        <button id="level-four" class="level-choice" type="button" disabled>Fase 4 🔒</button>
      </nav>
      <p id="instructions" class="instructions">Arraste os produtos e junte três iguais na mesma prateleira.</p>
    </header>
    <div id="board" class="board" aria-label="Prateleiras do jogo"></div>
    <div class="controls">
      <button id="undo" class="control secondary" type="button" disabled>↶ Desfazer</button>
      <button id="restart" class="control" type="button">↻ Reiniciar</button>
    </div>
    <p id="message" class="message" aria-live="polite">Os produtos escuros estão na fileira de trás.</p>
    <section id="win" class="win" hidden aria-live="polite"><h2>Prateleiras organizadas!</h2><p id="win-message"></p><button id="next-level" class="control" type="button">Próxima fase →</button></section>
    <details class="settings">
      <summary>♫ Som e vibração</summary>
      <div class="settings-content">
        <div class="setting-row">
          <label for="effects-enabled">Efeitos sonoros</label>
          <input id="effects-enabled" type="checkbox">
          <label for="effects-volume">Volume dos efeitos</label>
          <output id="effects-value" for="effects-volume"></output>
          <input id="effects-volume" type="range" min="0" max="100" step="1">
        </div>
        <div class="setting-row">
          <label for="music-enabled">Música ambiente</label>
          <input id="music-enabled" type="checkbox">
          <label for="music-volume">Volume da música</label>
          <output id="music-value" for="music-volume"></output>
          <input id="music-volume" type="range" min="0" max="100" step="1">
        </div>
        <div id="vibration-row" class="setting-row">
          <label for="vibration-enabled">Vibração</label>
          <input id="vibration-enabled" type="checkbox">
        </div>
        <p class="setting-note">A música começa depois da primeira interação com o jogo.</p>
      </div>
    </details>
  </main>
  <script>
    (() => {
      const products = {
        milk: {
          name: 'Leite',
          art: '<path d="M12 24 L19 11 H39 L48 24 V80 Q48 84 44 84 H12 Q8 84 8 80 V27 Z" fill="#edf9ff" stroke="#82b8d6" stroke-width="2"/><path d="M12 24 L19 11 H39 L48 24 Z" fill="#9acbe7"/><path d="M10 28 H47 V40 H10 Z M10 70 H47 V82 H10 Z" fill="#72add4"/><rect x="24" y="7" width="11" height="5" rx="2" fill="#558fb5"/><circle cx="28" cy="54" r="10" fill="#b9dbed"/><text x="28" y="58" text-anchor="middle" fill="#326d99" font-size="11">♥</text><text x="28" y="68" text-anchor="middle" fill="#326d99" font-size="7" font-weight="bold">LEITE</text>'
        },
        coffee: {
          name: 'Café',
          art: '<path d="M12 12 Q28 15 44 12 L48 23 L46 81 Q28 87 10 81 L8 23 Z" fill="#aa5429" stroke="#81401f" stroke-width="2"/><path d="M10 24 Q28 28 46 24 L46 31 Q28 35 10 31 Z" fill="#db8d4f"/><path d="M11 41 Q28 34 45 41 L45 68 Q28 75 11 68 Z" fill="#f9d899"/><ellipse cx="28" cy="51" rx="6" ry="9" transform="rotate(35 28 51)" fill="#88441f"/><path d="M24 56 Q29 52 32 46" fill="none" stroke="#f4c77c" stroke-width="1.5"/><text x="28" y="67" text-anchor="middle" fill="#704020" font-size="8" font-weight="bold">CAFÉ</text>'
        },
        jam: {
          name: 'Geleia',
          art: '<rect x="10" y="19" width="36" height="65" rx="9" fill="#ae3041" stroke="#812536" stroke-width="2"/><rect x="8" y="13" width="40" height="13" rx="3" fill="#f0a29a" stroke="#bd6d67" stroke-width="2"/><path d="M9 18 H47" stroke="#f9d3c6" stroke-width="3" stroke-dasharray="5 3"/><rect x="13" y="37" width="30" height="30" rx="5" fill="#fff1d0"/><path d="M28 59 C15 53 21 44 28 48 C35 44 41 53 28 59 Z" fill="#d44853"/><path d="M28 48 L25 44 M28 48 L32 44" stroke="#689347" stroke-width="2"/><text x="28" y="75" text-anchor="middle" fill="#fff1d0" font-size="7" font-weight="bold">GELEIA</text>'
        }
      };
      const levels = [
        {
          instructions: 'Arraste os produtos e junte três iguais na mesma prateleira.',
          hint: 'Os produtos escuros estão na fileira de trás.',
          shelves: [
            { front: ['milk', 'milk', null], back: [['coffee', 'jam', null]] },
            { front: ['coffee', 'coffee', 'milk'], back: [] },
            { front: ['jam', 'jam', null], back: [] },
            { front: [null, null, null], back: [] }
          ]
        },
        {
          instructions: 'Retire um produto da caixa para revelar o próximo e complete os trios.',
          hint: 'A caixa mostra quantos produtos ainda restam.',
          shelves: [
            { type: 'dispenser', front: [null, 'milk', null], back: [], queue: ['coffee', 'jam'] },
            { front: ['milk', 'milk', null], back: [] },
            { front: ['coffee', 'coffee', null], back: [] },
            { front: ['jam', 'jam', null], back: [] }
          ]
        },
        {
          instructions: 'Forme trios para abrir as prateleiras com correntes, uma de cada vez.',
          hint: 'A corrente destacada abre primeiro. Cada trio reduz seu contador.',
          shelves: [
            { front: ['milk', 'milk', null], back: [] },
            { front: ['coffee', 'coffee', 'milk'], back: [] },
            { front: ['jam', 'jam', 'coffee'], back: [] },
            { front: ['jam', null, null], back: [], lock: { remaining: 1, order: 0 } },
            { front: ['milk', 'milk', 'jam'], back: [], lock: { remaining: 1, order: 1 } },
            { front: ['milk', 'jam', 'jam'], back: [] }
          ]
        },
        {
          instructions: 'Combine produtos, abra a corrente e organize os itens da caixa.',
          hint: 'Dois trios abrem a corrente. Planeje as vagas para os produtos da caixa.',
          shelves: [
            { front: ['milk', 'milk', null], back: [['coffee', 'jam', null]] },
            { front: ['coffee', 'coffee', 'milk'], back: [] },
            { front: ['jam', 'jam', null], back: [] },
            { type: 'dispenser', front: [null, 'milk', null], back: [], queue: ['coffee', 'jam'] },
            { front: ['milk', 'coffee', 'jam'], back: [], lock: { remaining: 2, order: 0 } },
            { front: ['milk', 'coffee', 'jam'], back: [] }
          ]
        }
      ];
      const board = document.getElementById('board');
      const undo = document.getElementById('undo');
      const restart = document.getElementById('restart');
      const message = document.getElementById('message');
      const win = document.getElementById('win');
      const winMessage = document.getElementById('win-message');
      const nextLevel = document.getElementById('next-level');
      const levelLabel = document.getElementById('level');
      const instructions = document.getElementById('instructions');
      const levelButtons = [document.getElementById('level-one'), document.getElementById('level-two'), document.getElementById('level-three'), document.getElementById('level-four')];
      const copy = value => JSON.parse(JSON.stringify(value));
      let unlocked = 0;
      try {
        const saved = Number(localStorage.getItem('mercadinho-unlocked'));
        if (Number.isInteger(saved) && saved >= 0 && saved < levels.length) unlocked = saved;
      } catch {}
      let currentLevel = 0;
      try {
        const saved = Number(localStorage.getItem('mercadinho-level'));
        if (Number.isInteger(saved) && saved >= 0 && saved <= unlocked) currentLevel = saved;
      } catch {}
      let shelves = copy(levels[currentLevel].shelves);
      let history = [];
      let selected = null;
      let pointer = null;
      let completed = false;
      let animating = false;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const audioSettings = { effects: true, music: false, vibration: false, effectsVolume: 65, musicVolume: 30 };
      try {
        const saved = JSON.parse(localStorage.getItem('mercadinho-audio') || '{}');
        for (const key of ['effects', 'music', 'vibration']) {
          if (typeof saved[key] === 'boolean') audioSettings[key] = saved[key];
        }
        for (const key of ['effectsVolume', 'musicVolume']) {
          if (Number.isFinite(saved[key])) audioSettings[key] = Math.max(0, Math.min(100, saved[key]));
        }
      } catch {}
      const effectsEnabled = document.getElementById('effects-enabled');
      const effectsVolume = document.getElementById('effects-volume');
      const effectsValue = document.getElementById('effects-value');
      const musicEnabled = document.getElementById('music-enabled');
      const musicVolume = document.getElementById('music-volume');
      const musicValue = document.getElementById('music-value');
      const vibrationEnabled = document.getElementById('vibration-enabled');
      const vibrationRow = document.getElementById('vibration-row');
      let audioContext = null;
      let musicGain = null;
      let musicTimer = null;

      function saveAudioSettings() {
        try { localStorage.setItem('mercadinho-audio', JSON.stringify(audioSettings)); } catch {}
      }

      function updateAudioControls() {
        effectsEnabled.checked = audioSettings.effects;
        effectsVolume.value = audioSettings.effectsVolume;
        effectsValue.textContent = `${audioSettings.effectsVolume}%`;
        musicEnabled.checked = audioSettings.music;
        musicVolume.value = audioSettings.musicVolume;
        musicValue.textContent = `${audioSettings.musicVolume}%`;
        vibrationEnabled.checked = audioSettings.vibration;
        vibrationRow.hidden = typeof navigator.vibrate !== 'function';
        if (musicGain && audioContext) {
          musicGain.gain.setTargetAtTime(audioSettings.music ? audioSettings.musicVolume / 100 : 0, audioContext.currentTime, 0.02);
        }
      }

      async function activateAudio() {
        if ((!audioSettings.effects && !audioSettings.music) || document.hidden) return null;
        try {
          const AudioEngine = window.AudioContext || window.webkitAudioContext;
          if (!AudioEngine) return null;
          if (!audioContext) {
            audioContext = new AudioEngine();
            musicGain = audioContext.createGain();
            musicGain.connect(audioContext.destination);
            updateAudioControls();
          }
          if (audioContext.state === 'suspended') await audioContext.resume();
          return audioContext.state === 'running' ? audioContext : null;
        } catch {
          return null;
        }
      }

      function tone(context, frequency, start, duration, volume, output) {
        const oscillator = context.createOscillator();
        const envelope = context.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, start);
        envelope.gain.setValueAtTime(0.0001, start);
        envelope.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), start + 0.025);
        envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(envelope);
        envelope.connect(output);
        oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function playEffect(kind) {
        if (!audioSettings.effects || audioSettings.effectsVolume === 0) return;
        activateAudio().then(context => {
          if (!context || !audioSettings.effects || audioSettings.effectsVolume === 0) return;
          const sounds = {
            place: [523.25],
            match: [659.25, 783.99, 1046.5],
            unlock: [523.25, 659.25, 783.99],
            win: [523.25, 659.25, 783.99, 1046.5],
            undo: [440, 349.23]
          };
          const notes = sounds[kind] || [];
          notes.forEach((frequency, index) => tone(context, frequency, context.currentTime + index * 0.075, 0.22, 0.045 * audioSettings.effectsVolume / 100, context.destination));
        });
      }

      function playMusicPhrase() {
        if (!audioContext || audioContext.state !== 'running' || !audioSettings.music || document.hidden) return;
        const notes = [261.63, 329.63, 392, 329.63, 293.66, 349.23, 440, 349.23];
        notes.forEach((frequency, index) => tone(audioContext, frequency, audioContext.currentTime + index * 0.7, 0.8, 0.025, musicGain));
      }

      function stopMusic() {
        if (musicTimer !== null) clearInterval(musicTimer);
        musicTimer = null;
      }

      async function startMusic() {
        if (!audioSettings.music || document.hidden || musicTimer !== null) return;
        const context = await activateAudio();
        if (!context || !audioSettings.music || document.hidden || musicTimer !== null) return;
        playMusicPhrase();
        musicTimer = setInterval(playMusicPhrase, 5600);
      }

      function vibrate(duration) {
        if (!audioSettings.vibration || typeof navigator.vibrate !== 'function') return;
        try { navigator.vibrate(duration); } catch {}
      }

      effectsEnabled.addEventListener('change', () => {
        audioSettings.effects = effectsEnabled.checked;
        saveAudioSettings();
        updateAudioControls();
        if (audioSettings.effects) playEffect('place');
      });
      effectsVolume.addEventListener('input', () => {
        audioSettings.effectsVolume = Number(effectsVolume.value);
        saveAudioSettings();
        updateAudioControls();
      });
      musicEnabled.addEventListener('change', () => {
        audioSettings.music = musicEnabled.checked;
        saveAudioSettings();
        updateAudioControls();
        if (audioSettings.music) startMusic();
        else stopMusic();
      });
      musicVolume.addEventListener('input', () => {
        audioSettings.musicVolume = Number(musicVolume.value);
        saveAudioSettings();
        updateAudioControls();
      });
      vibrationEnabled.addEventListener('change', () => {
        audioSettings.vibration = vibrationEnabled.checked;
        saveAudioSettings();
        updateAudioControls();
        vibrate(15);
      });
      function onInteraction() {
        activateAudio().then(() => startMusic());
      }
      document.addEventListener('pointerdown', onInteraction, { passive: true });
      document.addEventListener('keydown', onInteraction);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopMusic();
          if (audioContext && audioContext.state === 'running') audioContext.suspend().catch(() => {});
        } else if (audioSettings.music) {
          startMusic();
        }
      });
      updateAudioControls();

      function itemMarkup(id) {
        if (!id) return '';
        const product = products[id];
        return `<span class="item ${id}"><svg viewBox="0 0 56 90" aria-hidden="true">${product.art}</svg></span>`;
      }

      function render(matching = [], revealed = []) {
        const activeLock = shelves.filter(shelf => shelf.lock && shelf.lock.remaining > 0).sort((a, b) => a.lock.order - b.lock.order)[0];
        board.innerHTML = shelves.map((shelf, shelfIndex) => {
          if (shelf.type === 'dispenser') {
            const item = shelf.front[1];
            const count = shelf.queue.length + (item ? 1 : 0);
            const active = selected && selected.shelf === shelfIndex && selected.slot === 1;
            const label = item ? `Dispensador: ${products[item].name}, ${count} produtos restantes` : 'Dispensador vazio';
            return `<div class="shelf dispenser"><span class="dispenser-label">Caixa de produtos</span><div class="front-row"><button type="button" class="slot ${item ? '' : 'empty'} ${active ? 'selected' : ''}" data-shelf="${shelfIndex}" data-slot="1" aria-label="${label}" ${completed ? 'disabled' : ''}>${itemMarkup(item)}</button></div><span class="dispenser-count" aria-hidden="true">${count} restantes</span></div>`;
          }
          const behind = shelf.back[0] || [null, null, null];
          const locked = shelf.lock && shelf.lock.remaining > 0;
          const backRow = behind.map(item => `<span>${itemMarkup(item)}</span>`).join('');
          const frontRow = shelf.front.map((item, slotIndex) => {
            const active = selected && selected.shelf === shelfIndex && selected.slot === slotIndex;
            const label = item ? products[item].name : 'Vaga livre';
            return `<button type="button" class="slot ${item ? '' : 'empty'} ${active ? 'selected' : ''}" data-shelf="${shelfIndex}" data-slot="${slotIndex}" aria-label="Prateleira ${shelfIndex + 1}, posição ${slotIndex + 1}: ${label}" ${completed || locked ? 'disabled' : ''}>${itemMarkup(item)}</button>`;
          }).join('');
          const effect = matching.includes(shelfIndex) ? 'matching' : revealed.includes(shelfIndex) ? 'revealed' : '';
          const lock = locked ? `<div class="lock-overlay" role="img" aria-label="Prateleira ${shelfIndex + 1} bloqueada, ${shelf.lock.remaining} ${shelf.lock.remaining === 1 ? 'trio' : 'trios'} para abrir, ${shelf === activeLock ? 'abre primeiro' : 'abre depois'}"><span class="lock-badge">🔒 ${shelf.lock.remaining}</span><span class="lock-caption">${shelf === activeLock ? 'Abre primeiro' : 'Abre depois'}</span></div>` : '';
          return `<div class="shelf ${effect}"><div class="back-row" aria-hidden="true">${backRow}</div><div class="front-row">${frontRow}</div>${lock}</div>`;
        }).join('');
        undo.disabled = animating || history.length === 0;
        restart.disabled = animating;
        board.setAttribute('aria-busy', String(animating));
        win.hidden = !completed;
        levelLabel.textContent = `Fase ${currentLevel + 1}`;
        instructions.textContent = levels[currentLevel].instructions;
        levelButtons.forEach((button, index) => {
          button.disabled = animating || index > unlocked;
          if (index === currentLevel) button.setAttribute('aria-current', 'step');
          else button.removeAttribute('aria-current');
        });
        levelButtons.forEach((button, index) => { button.textContent = `Fase ${index + 1}${index > unlocked ? ' 🔒' : ''}`; });
        winMessage.textContent = `Você concluiu a fase ${currentLevel + 1}. ✨`;
        nextLevel.hidden = currentLevel === levels.length - 1;
      }

      function pause(milliseconds) {
        return new Promise(resolve => setTimeout(resolve, reduceMotion.matches ? 0 : milliseconds));
      }

      async function settle() {
        while (true) {
          const matching = [];
          const revealed = [];
          shelves.forEach((shelf, index) => {
            if ((!shelf.lock || shelf.lock.remaining === 0) && shelf.front[0] && shelf.front.every(item => item === shelf.front[0])) matching.push(index);
          });
          if (matching.length) {
            render(matching);
            playEffect('match');
            vibrate(30);
            await pause(320);
            matching.forEach(index => { shelves[index].front = [null, null, null]; });
            for (const index of matching) {
              const activeLock = shelves.filter(shelf => shelf.lock && shelf.lock.remaining > 0).sort((a, b) => a.lock.order - b.lock.order)[0];
              if (activeLock) {
                activeLock.lock.remaining -= 1;
                if (activeLock.lock.remaining === 0) playEffect('unlock');
              }
            }
          }
          shelves.forEach((shelf, index) => {
            if ((!shelf.lock || shelf.lock.remaining === 0) && shelf.front.every(item => item === null) && shelf.back.length) {
              shelf.front = shelf.back.shift();
              revealed.push(index);
            }
          });
          if (revealed.length) {
            render([], revealed);
            await pause(280);
          }
          if (!matching.length && !revealed.length) break;
        }
        completed = shelves.every(shelf => shelf.front.every(item => item === null) && shelf.back.length === 0 && (!shelf.queue || shelf.queue.length === 0));
        if (completed && currentLevel < levels.length - 1) {
          unlocked = Math.max(unlocked, currentLevel + 1);
          try { localStorage.setItem('mercadinho-unlocked', String(unlocked)); } catch {}
        }
        if (completed) playEffect('win');
        animating = false;
        message.textContent = completed ? 'Muito bem! Você encontrou todas as combinações.' : 'Continue organizando os produtos.';
        render();
      }

      function move(from, to) {
        if (!from || !to || completed || animating) return false;
        const sourceShelf = shelves[from.shelf];
        const targetShelf = shelves[to.shelf];
        const source = sourceShelf.front;
        const target = targetShelf.front;
        if (!source[from.slot] || (sourceShelf.lock && sourceShelf.lock.remaining > 0) || (targetShelf.lock && targetShelf.lock.remaining > 0) || targetShelf.type === 'dispenser' || target[to.slot] !== null) return false;
        history.push(copy(shelves));
        target[to.slot] = source[from.slot];
        source[from.slot] = sourceShelf.type === 'dispenser' ? (sourceShelf.queue.shift() || null) : null;
        playEffect('place');
        vibrate(12);
        selected = null;
        animating = true;
        render();
        settle();
        return true;
      }

      function position(element) {
        const slot = element && element.closest('.slot');
        return slot && board.contains(slot) ? { shelf: Number(slot.dataset.shelf), slot: Number(slot.dataset.slot) } : null;
      }

      board.addEventListener('pointerdown', event => {
        if (event.button !== 0 || completed || animating) return;
        const origin = position(event.target);
        if (!origin) return;
        const slot = event.target.closest('.slot');
        const item = slot.querySelector('.item');
        const bounds = item && item.getBoundingClientRect();
        pointer = { id: event.pointerId, origin, x: event.clientX, y: event.clientY, bounds, dragging: false, ghost: null, target: null };
        board.setPointerCapture(event.pointerId);
      });

      board.addEventListener('pointermove', event => {
        if (!pointer || event.pointerId !== pointer.id) return;
        const item = shelves[pointer.origin.shelf].front[pointer.origin.slot];
        if (!item) return;
        if (!pointer.dragging && Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y) > 8) {
          pointer.dragging = true;
          pointer.ghost = document.createElement('div');
          pointer.ghost.className = 'ghost';
          pointer.ghost.innerHTML = itemMarkup(item);
          pointer.ghost.style.width = `${pointer.bounds.width}px`;
          pointer.ghost.style.height = `${pointer.bounds.height}px`;
          document.body.append(pointer.ghost);
          board.querySelector(`[data-shelf="${pointer.origin.shelf}"][data-slot="${pointer.origin.slot}"]`).classList.add('drag-origin');
        }
        if (pointer.ghost) {
          pointer.ghost.style.left = `${pointer.bounds.left + event.clientX - pointer.x}px`;
          pointer.ghost.style.top = `${pointer.bounds.top + event.clientY - pointer.y}px`;
          if (pointer.target) pointer.target.classList.remove('drop-target');
          const destination = document.elementFromPoint(event.clientX, event.clientY);
          const target = position(destination);
          pointer.target = target && shelves[target.shelf].type !== 'dispenser' && (!shelves[target.shelf].lock || shelves[target.shelf].lock.remaining === 0) && shelves[target.shelf].front[target.slot] === null ? destination.closest('.slot') : null;
          if (pointer.target) pointer.target.classList.add('drop-target');
        }
      });

      function finishPointer(event, cancelled = false) {
        if (!pointer || event.pointerId !== pointer.id) return;
        const current = pointer;
        pointer = null;
        if (current.ghost) current.ghost.remove();
        if (current.target) current.target.classList.remove('drop-target');
        const origin = board.querySelector(`[data-shelf="${current.origin.shelf}"][data-slot="${current.origin.slot}"]`);
        if (origin) origin.classList.remove('drag-origin');
        if (cancelled) return;
        const destination = position(document.elementFromPoint(event.clientX, event.clientY));
        if (current.dragging) {
          if (!move(current.origin, destination)) {
            message.textContent = 'Escolha uma vaga livre na frente da prateleira.';
            render();
          }
        } else if (destination) {
          if (selected && move(selected, destination)) return;
          selected = shelves[destination.shelf].front[destination.slot] ? destination : null;
          message.textContent = selected ? 'Agora toque em uma vaga livre.' : 'Escolha um produto para mover.';
          render();
        }
      }
      board.addEventListener('pointerup', event => finishPointer(event));
      board.addEventListener('pointercancel', event => finishPointer(event, true));
      board.addEventListener('click', event => {
        if (event.detail !== 0 || animating || completed) return;
        const destination = position(event.target);
        if (!destination) return;
        if (selected && move(selected, destination)) return;
        selected = shelves[destination.shelf].front[destination.slot] ? destination : null;
        render();
      });
      undo.addEventListener('click', () => {
        if (!history.length) return;
        shelves = history.pop();
        playEffect('undo');
        completed = false;
        selected = null;
        message.textContent = 'Última jogada desfeita.';
        render();
      });
      function openLevel(index) {
        if (animating || index > unlocked || index < 0 || index >= levels.length) return;
        currentLevel = index;
        shelves = copy(levels[index].shelves);
        history = [];
        selected = null;
        completed = false;
        message.textContent = levels[index].hint;
        try { localStorage.setItem('mercadinho-level', String(index)); } catch {}
        render();
      }
      levelButtons.forEach((button, index) => button.addEventListener('click', () => {
        if (index === currentLevel) return;
        if (history.length && !completed && !confirm('Trocar de fase e recomeçar a fase atual?')) return;
        openLevel(index);
      }));
      nextLevel.addEventListener('click', () => openLevel(currentLevel + 1));
      restart.addEventListener('click', () => {
        if (history.length && !confirm('Recomeçar esta fase?')) return;
        openLevel(currentLevel);
      });
      message.textContent = levels[currentLevel].hint;
      render();
    })();
  </script>
</body>
</html>
