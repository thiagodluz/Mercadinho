name: Validar formatos e Corrida
on:
  push:
    branches: [melhoria/formatos-e-corrida]
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/layout-impasse.cjs
      - run: node tests/arraste-rapido.cjs
      - run: node tests/modos-1.cjs
      - run: node tests/corrida-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-corrida
          path: qa/
