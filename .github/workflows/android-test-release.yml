name: Pré-release Android do Mercadinho

on:
  push:
    branches: [android/gesto-voltar]
    paths: [.github/workflows/android-test-release.yml]

jobs:
  release:
    if: github.repository == 'thiagodluz/Mercadinho'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62795f2b4afebcc50d2856f18181790ef498d5b9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar o Android SDK
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          test -n "$sdk_manager"
          "$sdk_manager" --licenses < <(yes) >/dev/null
          "$sdk_manager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Testar e compilar
        run: |
          npm ci
          npm test
          npm run android:sync
          gradle_zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          curl -fLsS --retry 2 --max-time 120 -H 'Accept: application/octet-stream' \
            'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/269969095?download=1' -o "$gradle_zip"
          sha=$(sed -n 's/^distributionSha256Sum=//p' android/gradle/wrapper/gradle-wrapper.properties)
          printf '%s  %s\n' "$sha" "$gradle_zip" | sha256sum -c -
          unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" -p android :app:assembleDebug --no-daemon
      - name: Verificar assinatura e conteúdo
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -tq "$apk"
          unzip -p "$apk" assets/public/index.html > /dev/null
          unzip -p "$apk" assets/public/fases.js > /dev/null
          unzip -p "$apk" assets/capacitor.plugins.json | grep -F "com.capacitorjs.plugins.app.AppPlugin"
          cp "$apk" Mercadinho-0.1.1-teste.apk
      - name: Publicar o APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          O gesto lateral de Voltar do Android agora abre a pausa durante a partida. Com a pausa aberta, Voltar retorna ao jogo. Para fechar o app, use **Sair do jogo** no menu de pausa.

          O APK aparece como **Mercadinho Teste** e pode ser instalado ao lado da versão 0.1.0, com progresso separado.

          Para testar o feedback tátil, ative **Som e vibração → Vibração** e faça um encaixe simples e um trio.

          Este é um APK de depuração assinado com um certificado de teste do Android. A vibração ainda precisa ser validada no aparelho.
          NOTES
          gh release create v0.1.1-teste Mercadinho-0.1.1-teste.apk \
            --target 62795f2b4afebcc50d2856f18181790ef498d5b9 --prerelease --latest=false \
            --title "Mercadinho 0.1.1 — APK de teste" --notes-file release-notes.md
