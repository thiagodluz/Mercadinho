name: Testar controles da prévia
on:
  push:
    branches: [teste/controles-previa]
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node experimentos/prateleiras-zen/teste-controles.cjs
