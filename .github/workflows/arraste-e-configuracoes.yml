name: Testar arraste e configurações
on:
  push:
    branches: [melhoria/arraste-e-configuracoes]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/layout-auditoria.cjs
      - run: node tests/layout-impasse.cjs
      - run: node tests/arraste-rapido.cjs
